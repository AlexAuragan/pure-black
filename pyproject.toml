[project]
name = "fabricrice"
version = "0.1.0"
description = "Add your description here"
requires-python = "==3.12.*"
dependencies = [
  "fabric @ git+https://github.com/AlexAuragan/fabric.git",
  "psutil>=7.1.0",
  "pygobject-stubs>=2.16.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.3",
    "black>=26.3.1",
    "pre-commit>=4.6.0",
    "ruff>=0.15.13",
]


[tool.black]
line-length = 120


[tool.basedpyright]
reportMissingModuleSource = false
typeCheckingMode = "standard"
reportIncompatibleVariableOverride = "none"
reportMissingParameterType = "error"
reportAny = "none"
reportExplicitAny = "none"
