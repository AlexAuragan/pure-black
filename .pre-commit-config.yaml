repos:
    - repo: local
      hooks:
          - id: black
            name: black
            entry: uv run black
            language: system
            types: [python]

    - repo: local
      hooks:
          - id: basedpyright
            name: basedpyright
            entry: uv run basedpyright
            language: system
            types: [python]
            pass_filenames: false
            require_serial: true
            args: ["--level=error"]
